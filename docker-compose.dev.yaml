name: cities
services:
  db:
    image: mariadb:11.3.2
    container_name: cities-dev-db
    environment:
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: cities
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d